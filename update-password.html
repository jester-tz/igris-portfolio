<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Igris</title>
<link rel="stylesheet" href="styles.css">
<style>
.reset-wrap{max-width:520px;margin:0 auto}
.reset-card{padding:30px;border:1px solid rgba(0,0,0,.10);border-radius:24px;background:rgba(255,255,255,.48)}
[data-theme="dark"] .reset-card{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.045)}
.reset-card h2{margin:0 0 8px}.reset-card p{opacity:.65;line-height:1.65}
.reset-status{font-size:13px;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<header class="site-header"><nav class="nav" aria-label="Primary">
<a class="brand" href="index.html"><span class="brand-mark"></span>igris</a>
<div class="nav-actions"><button class="theme-toggle" id="themeToggle" aria-label="Switch theme">☾</button></div>
</nav></header>

<main>
<section class="page-intro"><div class="container">
<div class="eyebrow">Project Account</div>
<h1>Choose a <em class="serif">new password.</em></h1>
<p>You're securely back at Igris. Create a new password for your Project Account.</p>
</div></section>

<section class="section"><div class="container"><div class="reset-wrap">
<div class="reset-card">
<div class="f-field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6"></div>
<div class="f-field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6"></div>
<button class="btn primary" id="resetBtn">Update password →</button>
<p class="reset-status" id="status"></p>
<p style="margin-top:20px;font-size:12px"><a href="index.html">Return to Igris</a></p>
</div>
</div></div></section>
</main>

<footer class="footer"><div class="container footer-inner"><div><div class="footer-brand">igris</div><small>© <span id="year"></span> Igris.</small></div><div class="footer-nav"><a href="privacy.html">Privacy & Security</a><a href="privacy.html#terms">Terms & Conditions</a></div></div></footer>

<script src="site.js"></script>
<script src="igris-auth.js"></script>
<script>
(async()=>{
  await new Promise(r=>setTimeout(r,250));
  const sb=window.igrisSupabase;
  const status=document.getElementById('status');
  const btn=document.getElementById('resetBtn');
  if(!sb){status.textContent='Account service is unavailable right now.';return}

  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    status.textContent='This reset link is invalid or has expired. Please request a new password reset email.';
    btn.disabled=true;
    return;
  }

  btn.onclick=async()=>{
    const p=document.getElementById('newPassword').value;
    const c=document.getElementById('confirmPassword').value;
    if(p.length<6)return status.textContent='Password must be at least 6 characters.';
    if(p!==c)return status.textContent='The passwords do not match.';
    btn.disabled=true;btn.textContent='Updating…';
    const {error}=await sb.auth.updateUser({password:p});
    if(error){btn.disabled=false;btn.textContent='Update password →';return status.textContent=error.message}
    status.textContent='Password updated successfully. You can now sign in with your new password.';
    btn.textContent='Password updated ✓';
  };
})();
</script>
</body>
</html>
