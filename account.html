<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — Igris</title><style>
body{margin:0;background:#08060d;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:90px 22px}.card{border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:28px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(139,92,246,.05));backdrop-filter:blur(18px);margin-bottom:20px}h1{font-size:clamp(2.5rem,7vw,5rem);letter-spacing:-.06em;margin:0}.muted{opacity:.65}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{padding:20px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}input,textarea{width:100%;box-sizing:border-box;margin:7px 0;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#120d19;color:#fff}button,a{display:inline-block;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;text-decoration:none;cursor:pointer;margin:5px 4px 0 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><p class="muted">IGRIS / ACCOUNT</p><h1 id="hello">Your space.</h1><p class="muted" id="email"></p><a href="index.html">Back to site</a><button id="logout">Log out</button></div><div class="grid"><div class="tile"><b>Submit a project</b><p class="muted">Send a new brief and track it here.</p><a href="submit-project.html">Start project →</a></div><div class="tile"><b>Saved work</b><p class="muted" id="saved">Loading…</p></div><div class="tile"><b>Profile</b><input id="display" placeholder="Display name"><input id="username" placeholder="Username"><textarea id="phone" placeholder="Phone (optional)"><textarea id="bio" placeholder="Short bio"></textarea><button id="save">Save profile</button><p id="status" class="muted"></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://kjimyrewcnbpwzmoxxpv.supabase.co","sb_publishable_ZVinjwmrApsFIt6YQ6Vb_w_DsrQPSYo");let user;
(async()=>{let r=await sb.auth.getUser();user=r.data.user;if(!user){location.href="index.html";return}email.textContent=user.email;hello.textContent="Hi, "+(user.user_metadata?.display_name||"there")+".";let p=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();if(p.data){display.value=p.data.display_name||"";username.value=p.data.username||"";bio.value=p.data.bio||""}let s=await sb.from("saved_work").select("work_id").eq("user_id",user.id);saved.textContent=s.data?.length?s.data.map(x=>x.work_id).join(" • "):"No saved work yet."})();save.onclick=async()=>{let r=await sb.from("profiles").upsert({id:user.id,display_name:display.value,username:username.value,phone:phone.value||null,bio:bio.value,updated_at:new Date().toISOString()});status.textContent=r.error?r.error.message:"Profile saved."};logout.onclick=async()=>{await sb.auth.signOut();location.href="index.html"};
</script></body></html>
